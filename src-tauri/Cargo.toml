[package]
name = "dispatcher"
version = "0.3.170"
edition = "2021"

[[bin]]
name = "Dispatcher"
path = "src/main.rs"

[lib]
name = "dispatcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# The objc 0.2 macros expand to `#[cfg(feature = "cargo-clippy")]` inside this
# crate, which the unexpected_cfgs lint flags 47 times. Declaring the value as
# expected silences those without disabling the lint for real mistakes.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
libc = "0.2"
# Serves the frontend and the browser IPC bridge on the web port.
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
futures-util = "0.3"
# Proxies the Vite dev server through the Dispatcher port during `tauri dev`.
reqwest = { version = "0.12", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
